name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_live_suites:
        description: 'Run live Anvil-backed settlement suites'
        required: false
        type: boolean
        default: true
      deploy_testnet:
        description: 'Deploy to OKX X Layer Testnet (requires GitHub Secrets)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gates:
    name: Offline Gates (Contracts, Policy, MCP, Server, SDK, Ledger)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci || npm install

      - name: Forge Build (Solidity compilation & artifacts)
        run: |
          cd contracts
          forge --version
          forge build

      - name: Contracts Foundry Tests (36 tests across 5 suites)
        run: |
          cd contracts
          forge test -vvv

      - name: Space Policy Engine Tests (13 tests offline)
        run: npm run test:policy

      - name: MCP Server Offline Tests (19 tests offline)
        run: node --test mcp/test/mcp-server.test.js

      - name: Server Persistence Offline Tests (2 tests M4-1, M4-2)
        run: node --test packages/server/test/persistence.test.js

      - name: SDK Client Offline Tests (5 tests SDK-1..SDK-5)
        run: node --test packages/sdk/test/client.test.js

      - name: SDK ABI Drift Tests (3 tests)
        run: node --test packages/sdk/test/abis.test.js

      - name: Proof Ledger Gate (Verify claims & execute evidence suites)
        run: node scripts/verify-proof-ledger.mjs

  live-anvil-gates:
    name: Live Anvil Settlement Gates
    runs-on: ubuntu-latest
    needs: offline-gates
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_live_suites == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry (including Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci || npm install

      - name: Pre-build contracts for fast Anvil harness deployment
        run: |
          cd contracts
          forge build

      - name: MCP Live Settlement Suite (Anvil-backed EVM settlement)
        run: node --test mcp/test/live-settlement.test.js

  testnet-lanes:
    name: Manual OKX X Layer Testnet Deployment
    runs-on: ubuntu-latest
    needs: offline-gates
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_testnet == true
    env:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      OKLINK_API_KEY: ${{ secrets.OKLINK_API_KEY }}
      XLAYER_RPC_URL: ${{ secrets.XLAYER_RPC_URL || 'https://testrpc.xlayer.tech' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GitHub Secrets Presence
        run: |
          if [ -z "${{ secrets.PRIVATE_KEY }}" ]; then
            echo "❌ Fatal: PRIVATE_KEY secret is not configured in GitHub Repository Secrets."
            exit 1
          fi
          echo "✅ GitHub Secrets validated (zero secrets exposed)."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci || npm install

      - name: Testnet Fork Pre-Flight (Zero Gas)
        run: make fork-test

      - name: Broadcast Deployment to OKX X Layer Testnet (Chain ID 1952)
        run: make deploy-testnet
